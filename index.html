<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Mobile Banking App</title>
    <link rel="stylesheet" href="styles/style.css" />


    <!-- daisyUi link -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#F4F5F7] h-[100vh] flex justify-center items-center">
    <form action="" class=" bg-white rounded-2xl p-5">
        <div class="mb-5">
            <label class="font-semibold">Mobile Number</label>
            <br>
            <input type="text" placeholder="Enter Your Number" class="input mt-2 bg-[#F4F5F7] rounded-3xl" />
        </div>
        <div class="mb-5">
            <label class="font-semibold">4 Digit Pin</label>
            <br>
            <input type="text" placeholder="Enter 4 Digit Pin" class="input mt-2 bg-[#F4F5F7] rounded-3xl" />
        </div>
        <button class="btn font-bold text-white bg-[#0874F2] w-full rounded-3xl ">Login</button>
    </form>


    <script src="js/script.js"></script>
  </body>
</html>
